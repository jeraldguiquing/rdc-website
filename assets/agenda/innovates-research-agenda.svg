<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" width="100%" height="100%" role="img" aria-label="INNOVATES - MCNP and ISAP Institutional Research Agenda 2026-2030">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="1"/>
    </radialGradient>

    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="35%" stop-color="#d97706"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Navy Blue Gradients (ISAP) -->
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#0b2545"/>
      <stop offset="100%" stop-color="#091b33"/>
    </linearGradient>

    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Emerald Green Gradient (MCNP) -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d5c3a"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>

    <!-- Text Metallic Navy Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="30%" stop-color="#0f2952"/>
      <stop offset="70%" stop-color="#0b1e38"/>
      <stop offset="100%" stop-color="#061224"/>
    </linearGradient>

    <!-- Chrome Sheen -->
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b2545" flood-opacity="0.16"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Card / Badge Container -->
  <rect x="10" y="10" width="1080" height="320" rx="24" fill="url(#bgGlow)" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>

  <!-- Subtle Blueprint Grid Pattern in Background -->
  <g opacity="0.04" stroke="#0b2545" stroke-width="1">
    <line x1="50" y1="40" x2="1050" y2="40"/>
    <line x1="50" y1="80" x2="1050" y2="80"/>
    <line x1="50" y1="120" x2="1050" y2="120"/>
    <line x1="50" y1="160" x2="1050" y2="160"/>
    <line x1="50" y1="200" x2="1050" y2="200"/>
    <line x1="50" y1="240" x2="1050" y2="240"/>
    <line x1="50" y1="280" x2="1050" y2="280"/>
  </g>

  <!-- Left Icon Emblem: Multi-layered Golden Innovation Beacon / Spark -->
  <g transform="translate(65, 45)">
    <!-- Outer Shield / Hexagonal Emblem -->
    <polygon points="65,5 125,40 125,110 65,145 5,110 5,40" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="3.5" filter="url(#shadow)"/>
    
    <!-- Inner Hexagon Ring with Green Accent -->
    <polygon points="65,18 113,46 113,104 65,132 17,104 17,46" fill="none" stroke="url(#greenGrad)" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.85"/>

    <!-- Dynamic Modern "i" in Gold with Dimensional Flare -->
    <!-- The "i" Dot: Glowing 8-Point Compass Star / Diamond -->
    <path d="M65,30 L69,43 L82,47 L69,51 L65,64 L61,51 L48,47 L61,43 Z" fill="url(#goldLight)" filter="url(#glow)"/>
    <circle cx="65" cy="47" r="3.5" fill="#ffffff"/>

    <!-- The "i" Stem: Curved Kinetic Pillar -->
    <path d="M57,69 C57,69 67,67 71,72 C74,76 72,83 69,92 L62,114 C59,122 62,126 69,124 C74,122 78,118 78,118 L76,123 C76,123 70,128 63,128 C55,128 50,123 53,113 L60,91 C63,82 61,77 55,79 Z" fill="url(#goldGrad)"/>

    <!-- Small Atom / Orbital Track around "i" -->
    <ellipse cx="65" cy="85" rx="46" ry="16" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.65" transform="rotate(-26 65 85)"/>
    <circle cx="98" cy="72" r="3" fill="#38bdf8"/>
    <circle cx="32" cy="98" r="2.5" fill="#f59e0b"/>
  </g>

  <!-- Top Institutional Micro-Header -->
  <g transform="translate(230, 68)">
    <rect x="0" y="-18" width="220" height="24" rx="12" fill="#0b2545"/>
    <text x="110" y="-2" font-family="'Oswald', 'Montserrat', Arial, sans-serif" font-size="11" font-weight="700" fill="#ffdf70" text-anchor="middle" letter-spacing="2.5">MCNP &amp; ISAP RDC</text>
    
    <text x="235" y="-3" font-family="'Roboto', 'Arial', sans-serif" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">INSTITUTIONAL RESEARCH FRAMEWORK</text>
  </g>

  <!-- Main Wordmark: INNOVATES -->
  <g transform="translate(226, 172)">
    <!-- Main Bold Serif/Modern Geometric Heading -->
    <text x="0" y="0" font-family="'Oswald', 'Montserrat', 'Arial Black', sans-serif" font-size="104" font-weight="900" fill="url(#textGrad)" letter-spacing="4" font-style="italic">
      INNOVATES
    </text>

    <!-- Highlight Overlay Sheen on Text -->
    <text x="0" y="0" font-family="'Oswald', 'Montserrat', 'Arial Black', sans-serif" font-size="104" font-weight="900" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" letter-spacing="4" font-style="italic">
      INNOVATES
    </text>

    <!-- Compass / Star Motif inside the 'O' (approx x=365, y=-38) -->
    <g transform="translate(372, -37)">
      <!-- Mini Compass Rose within letter O -->
      <circle cx="0" cy="0" r="16" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.9"/>
      <polygon points="0,-13 4,-3 14,0 4,3 0,13 -4,3 -14,0 -4,-3" fill="url(#goldGrad)"/>
      <circle cx="0" cy="0" r="3" fill="#ffffff"/>
    </g>

    <!-- Dynamic Racing Swoosh Ribbon Below Letters (Emerald Green + Gold + Royal Navy) -->
    <!-- MCNP Green Streak -->
    <path d="M-8,14 C120,13 280,18 420,18 C580,18 720,12 820,-4 L810,0 C710,16 570,22 410,22 C270,22 110,17 -18,17 Z" fill="url(#greenGrad)"/>

    <!-- ISAP Navy Streak -->
    <path d="M20,24 C160,24 320,27 480,27 C640,27 770,20 835,4 L825,8 C760,24 630,31 470,31 C310,31 150,28 10,28 Z" fill="url(#blueAccent)"/>

    <!-- Gold Leading Accent Dart -->
    <polygon points="835,4 845,0 820,-3 810,1" fill="url(#goldGrad)"/>
  </g>

  <!-- Tagline and Years (2026–2030) -->
  <g transform="translate(230, 230)">
    <!-- Golden Badge: 2026-2030 -->
    <rect x="0" y="-16" width="128" height="26" rx="6" fill="url(#goldGrad)"/>
    <text x="64" y="2" font-family="'Oswald', 'Montserrat', Arial, sans-serif" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="1.5">2026–2030</text>

    <!-- Unified Research Scope Tagline -->
    <text x="145" y="1" font-family="'Roboto', 'Arial', sans-serif" font-size="14.5" font-weight="700" fill="#0f172a" letter-spacing="0.5">
      STRATEGIC RESEARCH &amp; EXTENSION ROADMAP
    </text>
  </g>

  <!-- 9 Pillar Acronym Track Strip along the bottom of the card -->
  <g transform="translate(50, 282)">
    <!-- Container Bar -->
    <rect x="0" y="0" width="1000" height="28" rx="8" fill="#0f172a" opacity="0.05"/>
    
    <!-- 9 Acronym Tags -->
    <text x="15" y="19" font-family="'Oswald', Arial, sans-serif" font-size="12" font-weight="800" fill="#0d5c3a"><tspan fill="#d97706">I</tspan>NSPIRE</text>
    <circle cx="85" cy="14" r="2" fill="#94a3b8"/>

    <text x="98" y="19" font-family="'Oswald', Arial, sans-serif" font-size="12" font-weight="800" fill="#0b2545"><tspan fill="#d97706">N</tspan>URTURE</text>
    <circle cx="178" cy="14" r="2" fill="#94a3b8"/>

    <text x="191" y="19" font-family="'Oswald', Arial, sans-serif" font-size="12" font-weight="800" fill="#0b2545"><tspan fill="#d97706">N</tspan>AVIGATE</text>
    <circle cx="275" cy="14" r="2" fill="#94a3b8"/>

    <text x="288" y="19" font-family="'Oswald', Arial, sans-serif" font-size="12" font-weight="800" fill="#0d5c3a"><tspan fill="#d97706">O</tspan>PERATIONALIZE</text>
    <circle cx="414" cy="14" r="2" fill="#94a3b8"/>

    <text x="427" y="19" font-family="'Oswald', Arial, sans-serif" font-size="12" font-weight="800" fill="#0b2545"><tspan fill="#d97706">V</tspan>ALUE</text>
    <circle cx="488" cy="14" r="2" fill="#94a3b8"/>

    <text x="501" y="19" font-family="'Oswald', Arial, sans-serif" font-size="12" font-weight="800" fill="#0d5c3a"><tspan fill="#d97706">A</tspan>DVANCE</text>
    <circle cx="583" cy="14" r="2" fill="#94a3b8"/>

    <text x="596" y="19" font-family="'Oswald', Arial, sans-serif" font-size="12" font-weight="800" fill="#0b2545"><tspan fill="#d97706">T</tspan>RANSFORM</text>
    <circle cx="698" cy="14" r="2" fill="#94a3b8"/>

    <text x="711" y="19" font-family="'Oswald', Arial, sans-serif" font-size="12" font-weight="800" fill="#0d5c3a"><tspan fill="#d97706">E</tspan>XPAND</text>
    <circle cx="781" cy="14" r="2" fill="#94a3b8"/>

    <text x="794" y="19" font-family="'Oswald', Arial, sans-serif" font-size="12" font-weight="800" fill="#0b2545"><tspan fill="#d97706">S</tspan>TRENGTHEN</text>
    
    <rect x="895" y="3" width="95" height="22" rx="4" fill="#0b2545"/>
    <text x="942" y="18" font-family="'Oswald', Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">9 AGENDAS</text>
  </g>
</svg>

